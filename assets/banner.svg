<svg width="100%" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="900" height="140" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="138" rx="13" fill="none" stroke="#334155" stroke-width="1"/>
  <rect x="0" y="0" width="6" height="140" rx="3" fill="url(#accent)"/>

  <text x="40" y="58" font-family="'Segoe UI', Consolas, monospace" font-size="30" font-weight="700" fill="#f8fafc">
    Hi, I'm Pratham
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
  </text>
  <text x="40" y="58" font-family="'Segoe UI', Consolas, monospace" font-size="30" fill="#f8fafc">
    <tspan> 👋</tspan>
  </text>

  <text x="41" y="92" font-family="Consolas, monospace" font-size="17" fill="#94a3b8">
    <tspan fill="#38bdf8">AI / ML Developer</tspan>
    <tspan fill="#64748b">  •  </tspan>
    <tspan fill="#a78bfa">Deep Learning &amp; Computer Vision</tspan>
    <tspan fill="#64748b">  •  </tspan>
    <tspan fill="#f472b6">PyTorch</tspan>
  </text>

  <text x="41" y="118" font-family="Consolas, monospace" font-size="14" fill="#64748b">
    Building NoteShield_AI — a transfer-learning model that flags counterfeit currency
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1.6s" fill="freeze"/>
  </text>
</svg>
